[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cache-doctor"
version = "0.1.0"
description = "Semantic-cache health diagnostics: hit rate, expiry, and cache-pollution analysis for LLM response caches"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "hao li" }]
keywords = ["llm", "semantic-cache", "cache", "diagnostics", "prompt-caching"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/hahahahahahahahah6/cache-doctor"
Repository = "https://github.com/hahahahahahahahah6/cache-doctor"
Issues = "https://github.com/hahahahahahahahah6/cache-doctor/issues"

[project.scripts]
cache-doctor = "cache_doctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
